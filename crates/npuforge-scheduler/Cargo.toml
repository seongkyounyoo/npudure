[package]
name = "npuforge-scheduler"
description = "NPUDure 중앙 스케줄러. 노드 레지스트리, 스케줄링 정책, 헬스체크, 재시도"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "npuforge_scheduler"
path = "src/lib.rs"

[[bin]]
name = "npuforge-scheduler"
path = "src/main.rs"

[dependencies]
npuforge-common.workspace = true
npuforge-proto.workspace = true
bytes = "1"
tonic = "0.12"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

[dev-dependencies]
npuforge-node.workspace = true
npuforge-mock-backend.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
